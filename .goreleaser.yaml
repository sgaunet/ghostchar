version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/sgaunet/ghostchar/cmd.version={{.Version}}
      - -X github.com/sgaunet/ghostchar/cmd.commit={{.Commit}}
      - -X github.com/sgaunet/ghostchar/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew cask publishing (replaces the deprecated `brews:` block; casks are
# what GoReleaser supports going forward)
homebrew_casks:
  - name: ghostchar
    homepage: 'https://github.com/sgaunet/ghostchar'
    description: 'Detect invisible Unicode, PUA, and bidi characters in source files'

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Command name users invoke, mapped from the artifact name.
    binaries:
      - ghostchar

    # Strip the Gatekeeper quarantine xattr so the installed binary can run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
